[project]
name = "tf2-name-scan"
version = "0.1.0"
description = "Resumable TF2 killfeed OCR corpus and username search"
readme = "README.md"
requires-python = ">=3.10.11,<3.11"
dependencies = ["Pillow>=10", "numpy>=1.26", "PyYAML>=6", "rapidfuzz>=3", "yt-dlp[default]>=2025.1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.scripts]
tf2scan = "tf2scan.cli:main"

[project.optional-dependencies]
paddle = ["paddleocr==3.7.0", "paddlex[ocr]==3.7.2", "paddlepaddle-gpu==3.3.1"]
dev = ["pytest>=8", "ruff>=0.9"]

[tool.hatch.build.targets.wheel]
packages = ["src/tf2scan"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.uv]
# The direct Paddle GPU wheel below targets this local Windows x64 environment.
environments = ["sys_platform == 'win32' and platform_machine == 'AMD64'"]
# Paddle 3.3.1's Windows cu126 binary reports cuDNN 9.9, but its metadata pins 9.5.
override-dependencies = ["nvidia-cudnn-cu12==9.9.0.52"]

[tool.uv.sources]
# Official CUDA 12.6 wheel for Windows x64 / Python 3.10; bypasses the package index.
paddlepaddle-gpu = { url = "https://paddle-whl.cdn.bcebos.com/stable/cu126/paddlepaddle-gpu/paddlepaddle_gpu-3.3.1-cp310-cp310-win_amd64.whl" }
